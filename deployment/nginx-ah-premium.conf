# ah-premium 反向代理片段
# 用法（在服务器上以 root 执行）：
#   把下面的 location 块加入现有 server{} 配置（通常在
#   /etc/nginx/sites-enabled/default 的 listen 80 的 server 块内），然后：
#   nginx -t && systemctl reload nginx
#
# 之后访问: http://110.42.211.118/ah-premium/

location /ah-premium/ {
    proxy_pass http://127.0.0.1:4415/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
